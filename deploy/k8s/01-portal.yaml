# Портал: Postgres, права на чтение Ingress и сам сервис.
#
# Учётных данных Kubernetes здесь нет ни одной строкой — токен и CA монтирует
# kubelet в /var/run/secrets/kubernetes.io/serviceaccount, а адрес API-сервера
# приходит в KUBERNETES_SERVICE_HOST. Достаточно указать serviceAccountName.
---
apiVersion: v1
kind: Namespace
metadata:
  name: api-portal
---
apiVersion: v1
kind: Secret
metadata:
  name: portal-secrets
  namespace: api-portal
stringData:
  # Демо-значения. В настоящей установке — из вашего хранилища секретов.
  database-url: postgres://portal:portal@postgres:5432/portal?sslmode=disable
  admin-user: admin
  admin-password: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: api-portal
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_USER, value: portal }
            - { name: POSTGRES_PASSWORD, value: portal }
            - { name: POSTGRES_DB, value: portal }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "portal", "-d", "portal"] }
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        # Для демо хватает emptyDir. В проде — PVC с блочным хранилищем.
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: api-portal
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-portal
  namespace: api-portal
---
# Единственное право, которое нужно порталу: прочитать список Ingress.
# Ровно то же самое делает `kubectl get ing -A` — это один и тот же вызов API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-portal-ingress-reader
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-portal-ingress-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-portal-ingress-reader
subjects:
  - kind: ServiceAccount
    name: api-portal
    namespace: api-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-portal
  namespace: api-portal
spec:
  # Реплик может быть больше: опрашивать будет всё равно одна, её выбирает
  # advisory-lock в Postgres. Иначе три реплики означали бы тройную нагрузку
  # на каждый опрашиваемый сервис.
  replicas: 1
  selector: { matchLabels: { app: api-portal } }
  template:
    metadata: { labels: { app: api-portal } }
    spec:
      serviceAccountName: api-portal
      containers:
        - name: portal
          image: api-portal:dev
          imagePullPolicy: Never # локально собранный образ OrbStack
          env:
            - name: PORTAL_DATABASE_URL
              valueFrom: { secretKeyRef: { name: portal-secrets, key: database-url } }
            - name: PORTAL_ADMIN_USER
              valueFrom: { secretKeyRef: { name: portal-secrets, key: admin-user } }
            - name: PORTAL_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: portal-secrets, key: admin-password } }
            # Опрос ходит в backend-сервисы, а не в публичные хосты из Ingress:
            # изнутри кластера такой хост часто не резолвится или уходит на
            # внешний балансировщик и возвращается обратно.
            - { name: PORTAL_K8S_TARGET, value: service }
            - { name: PORTAL_K8S_SYNC_INTERVAL, value: 1m }
            - { name: PORTAL_LOG_LEVEL, value: info }
            # Демо-стенд отвечает мгновенно; в проде оставьте значения по
            # умолчанию (1h) — их всё равно можно менять на странице настроек.
            - { name: PORTAL_PROXY_ENABLED, value: "true" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: api-portal
  namespace: api-portal
spec:
  selector: { app: api-portal }
  ports: [{ port: 80, targetPort: 8080 }]
