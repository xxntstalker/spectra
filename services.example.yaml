# Шаблон реестра. Скопируйте в services.yaml и впишите свои сервисы.
#
# Обязателен только baseUrl — путь к спеке портал находит сам: сначала
# перебирает конвенциональные адреса (/v3/api-docs, /openapi.json,
# /swagger/v1/swagger.json, /q/openapi, ...), а если не нашёл, читает
# HTML-страницу документации и достаёт адрес спеки оттуда. Найденный адрес
# запоминается в БД, так что перебор происходит один раз.

listen: ":8080"
database: ./data/portal.db

poll:
  # Раз в час. Спека меняется на деплое, а не поминутно, и портал — сторонний
  # наблюдатель за чужими сервисами: он не должен быть заметен в их графиках
  # трафика. Кому нужен ответ быстрее — жмёт «Опросить» в интерфейсе.
  interval: 1h
  # Таймаут одного HTTP-запроса.
  timeout: 10s
  # Бюджет на весь опрос одного сервиса. Автопоиск делает до 45 запросов,
  # поэтому если сюда поставить то же, что в timeout, медленный (но живой)
  # сервис не найдётся никогда: дедлайн истечёт на середине перебора.
  budget: 2m
  # Потолок паузы между повторными попытками для сервиса, который стабильно
  # не отдаёт спеку. Пауза растёт от interval вдвое на каждую неудачу,
  # поэтому потолок должен быть больше interval.
  maxBackoff: 6h
  concurrency: 8

retention:
  # Сколько ревизий спеки хранить на сервис. Каждая ревизия — полная копия
  # спеки, так что без потолка база растёт вместе с частотой деплоев.
  versions: 100

defaults:
  # Не считать сменой контракта то, что сервис переехал на другой адрес:
  # servers/host/basePath выбрасываются перед вычислением хэша.
  ignoreServers: true
  # Поля, выбрасываемые перед вычислением хэша. Нужно, если генератор
  # проставляет в спеку номер сборки или таймштамп: без этого каждый билд
  # даёт «новую ревизию», хотя контракт не менялся.
  #
  # Порядок элементов в массивах (required, enum, tags, parameters, security)
  # нормализуется всегда — генераторы часто выдают их в непредсказуемом
  # порядке, и настраивать это не нужно.
  ignoreFields: []
  # - info.version        # если версия API = версия сборки
  # - info.description    # если туда попадает время сборки
  #
  # "Try it out" из портала идёт через прокси портала. Учтите: у портала нет
  # собственной аутентификации — см. раздел про безопасность в README.
  proxy: false

services:
  - id: orders                       # обязателен, уникальный и URL-safe
    name: Orders                     # по умолчанию = id
    group: Commerce                  # группа в левом меню
    baseUrl: http://orders.internal  # обязателен
    tags: [core, public]

  - id: billing
    name: Billing
    group: Commerce
    baseUrl: http://billing.internal
    proxy: true                      # перекрывает defaults для этого сервиса

  # Явный путь к спеке — если автопоиск промахнулся или не хочется тратить
  # на перебор время при первом опросе.
  - id: legacy-payments
    name: Legacy Payments
    group: Commerce
    baseUrl: http://payments.internal
    specUrl: /v2/api-docs
    tags: [legacy]

  # Заголовки поддерживают подстановку из окружения — токены не хранятся
  # в файле, который лежит в git.
  - id: partner-gateway
    name: Partner Gateway
    group: Platform
    baseUrl: https://gateway.internal
    headers:
      Authorization: "Bearer ${GATEWAY_TOKEN}"
