<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Спецификация</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
  </style>
</head>
<body>
  <script>
    // The viewer runs in its own document (the portal embeds it in an iframe)
    // so that the API reference bundle cannot collide with the portal's own
    // styles, and so switching services is a plain iframe navigation.
    (function () {
      const params = new URLSearchParams(location.search);
      const service = params.get('service');
      if (!service) {
        document.body.textContent = 'Не указан сервис.';
        return;
      }
      let specURL = '/api/services/' + encodeURIComponent(service) + '/spec';
      const version = params.get('version');
      if (version) specURL += '?version=' + encodeURIComponent(version);

      const darkMode = (function () {
        var t = params.get('theme');
        if (t === 'dark') return true;
        if (t === 'light') return false;
        return window.matchMedia('(prefers-color-scheme: dark)').matches;
      })();

      function render(proxyEnabled) {
        const mount = document.createElement('script');
        mount.id = 'api-reference';
        mount.dataset.url = specURL;
        mount.dataset.configuration = JSON.stringify({
          theme: 'default',
          darkMode: darkMode,
          hideDownloadButton: false,
          // The portal already provides its own navigation between services.
          showSidebar: true,
          // Без прокси отправлять запрос некуда: портал его не пропустит, а
          // адрес сервиса из спеки вырезан — он внутренний и показывать его
          // читателю нельзя. Кнопка, которая всегда упирается в ошибку, хуже
          // отсутствующей.
          hideTestRequestButton: !proxyEnabled,
          hideClientButton: !proxyEnabled
        });
        document.body.appendChild(mount);

        const bundle = document.createElement('script');
        bundle.src = '/vendor/scalar.standalone.js';
        document.body.appendChild(bundle);
      }

      // Состояние спрашивается у сервера, а не берётся из адреса страницы:
      // параметром можно было бы вернуть себе кнопку, которая всё равно
      // получит отказ.
      //
      // Логин учитывается по той же причине: прокси — операция под учётной
      // записью, и посетителю без неё кнопка тоже не даёт ничего, кроме 401.
      fetch('/api/overview', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (o) { render(Boolean(o.proxyEnabled) && Boolean(o.admin)); })
        .catch(function () { render(false); });
    })();
  </script>
</body>
</html>
